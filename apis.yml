name: Stilla Technologies
description: 'Stilla Technologies is a life-sciences instrumentation company that develops digital PCR
  (dPCR) systems, consumables, and assays, best known for its Naica system for Crystal Digital PCR and
  the Nio product line. With operations in France and the United States, its technology serves oncology
  diagnostics, cell and gene therapy, and infectious-disease testing. Stilla was acquired by Bio-Rad
  Laboratories (announced February 2025, ~$225M plus up to $50M in milestones, closed 2025); its web
  properties now redirect to Bio-Rad. The company operates laboratory hardware and consumables rather
  than a public developer platform — no OpenAPI, developer portal, SDKs, CLI, or MCP surface was found
  during enrichment.'
